

<!DOCTYPE html>

<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Arcade Target 2.0</title>

<style>

* { box-sizing: border-box; }

body {

  margin: 0;

  padding: 25px 15px;

  min-height: 100vh;

  background: #09091c;

  color: white;

  font-family: Arial, sans-serif;

  text-align: center;

}

h1 {

  color: #00eaff;

  font-size: 32px;

  text-shadow: 0 0 18px #00eaff;

}

.subtitle { color: #aaa; }

.stats {

  display: grid;

  grid-template-columns: repeat(3, 1fr);

  gap: 9px;

  max-width: 500px;

  margin: 25px auto 15px;

}

.stat {

  background: #202044;

  border: 1px solid #494979;

  border-radius: 13px;

  padding: 13px 5px;

  font-size: 12px;

}

.stat strong {

  display: block;

  color: #ffe34d;

  font-size: 25px;

  margin-top: 7px;

}

#level {

  color: #00eaff;

}

#arena {

  position: relative;

  width: 100%;

  max-width: 500px;

  height: 350px;

  margin: auto;

  overflow: hidden;

  background:

    radial-gradient(circle, #25254c 1px, transparent 1px);

  background-size: 22px 22px;

  background-color: #13132d;

  border: 2px solid #00eaff;

  border-radius: 18px;

  box-shadow: 0 0 20px #00eaff44;

}

.target {

  position: absolute;

  width: 62px;

  height: 62px;

  border-radius: 50%;

  border: 5px solid white;

  cursor: pointer;

  touch-action: manipulation;

}

.red {

  background: #ff3158;

  box-shadow: 0 0 22px #ff3158;

}

.gold {

  background: #ffdf30;

  box-shadow: 0 0 25px #ffdf30;

  border-color: #fff5b0;

}

#message {

  min-height: 28px;

  margin: 20px 0 5px;

  color: #ffe34d;

  font-weight: bold;

}

button.start {

  margin: 15px auto;

  padding: 16px 30px;

  border: none;

  border-radius: 30px;

  background: #00eaff;

  color: #09091c;

  font-size: 17px;

  font-weight: bold;

}

button:active { transform: scale(.96); }

#sound {

  background: #29294a;

  color: white;

  border: 1px solid #555;

  border-radius: 20px;

  padding: 10px 18px;

}

.legend {

  color: #bbb;

  font-size: 13px;

  line-height: 2;

}

</style>

</head>

<body>

<h1>🎯 ARCADE TARGET</h1>

<p class="subtitle">VERSIONE 2.0 — THE CHALLENGE</p>

<div class="stats">

  <div class="stat">

    PUNTEGGIO

    <strong id="score">0</strong>

  </div>

  <div class="stat">

    TEMPO

    <strong id="time">30</strong>

  </div>

  <div class="stat">

    LIVELLO

    <strong id="level">1</strong>

  </div>

</div>

<div class="stats">

  <div class="stat" style="grid-column:span 3">

    🏆 RECORD PERSONALE

    <strong id="best">0</strong>

  </div>

</div>

<div id="arena">

  <button id="target" class="target red"

    aria-label="Colpisci il bersaglio"

    style="display:none"></button>

</div>

<div id="message">Sei pronto alla sfida?</div>

<button class="start" id="start">

  INIZIA A GIOCARE

</button>

<br>

<button id="sound">🔊 AUDIO ON</button>

<p class="legend">

  🔴 Bersaglio rosso: +1 punto<br>

  🟡 Bersaglio dorato: +5 punti

</p>

<script>

let score = 0;

let time = 30;

let level = 1;

let playing = false;

let timer;

let movement;

let soundOn = true;

let audio;

let best = Number(

  localStorage.getItem("arcadeBest")

) || 0;

const arena = document.getElementById("arena");

const target = document.getElementById("target");

const scoreDisplay = document.getElementById("score");

const timeDisplay = document.getElementById("time");

const levelDisplay = document.getElementById("level");

const bestDisplay = document.getElementById("best");

const message = document.getElementById("message");

bestDisplay.textContent = best;

function playSound(frequency, duration) {

  if (!soundOn) return;

  try {

    audio = audio || new AudioContext();

    const oscillator = audio.createOscillator();

    const gain = audio.createGain();

    oscillator.connect(gain);

    gain.connect(audio.destination);

    oscillator.frequency.value = frequency;

    gain.gain.value = 0.08;

    oscillator.start();

    oscillator.stop(audio.currentTime + duration);

  } catch (error) {}

}

function moveTarget() {

  const maxX = arena.clientWidth - target.offsetWidth;

  const maxY = arena.clientHeight - target.offsetHeight;

  target.style.left = Math.random() * maxX + "px";

  target.style.top = Math.random() * maxY + "px";

  const special = Math.random() < 0.20;

  target.className = special

    ? "target gold"

    : "target red";

  target.dataset.points = special ? "5" : "1";

}

function startGame() {

  clearInterval(timer);

  clearInterval(movement);

  score = 0;

  time = 30;

  level = 1;

  playing = true;

  scoreDisplay.textContent = score;

  timeDisplay.textContent = time;

  levelDisplay.textContent = level;

  message.textContent = "COLPISCI I BERSAGLI!";

  document.getElementById("start").textContent = "RICOMINCIA";

  target.style.display = "block";

  moveTarget();

  movement = setInterval(moveTarget, 1000);

  timer = setInterval(() => {

    time--;

    timeDisplay.textContent = time;

    if (time <= 0) endGame();

  }, 1000);

}

function updateLevel() {

  const newLevel = Math.floor(score / 10) + 1;

  if (newLevel > level) {

    level = newLevel;

    levelDisplay.textContent = level;

    message.textContent = "🔥 LIVELLO " + level + "!";

    playSound(700, 0.15);

    clearInterval(movement);

    const speed = Math.max(300, 1000 - (level - 1) * 100);

    movement = setInterval(moveTarget, speed);

  }

}

target.addEventListener("click", () => {

  if (!playing) return;

  const points = Number(target.dataset.points);

  score += points;

  scoreDisplay.textContent = score;

  playSound(points === 5 ? 950 : 550, 0.08);

  moveTarget();

  updateLevel();

});

function endGame() {

  playing = false;

  clearInterval(timer);

  clearInterval(movement);

  target.style.display = "none";

  document.getElementById("start").textContent =

    "GIOCA ANCORA";

  playSound(250, 0.35);

  if (score > best) {

    best = score;

    localStorage.setItem("arcadeBest", best);

    bestDisplay.textContent = best;

    message.textContent =

      "🏆 NUOVO RECORD! " + score + " PUNTI!";

  } else {

    message.textContent =

      "PARTITA FINITA! " + score + " PUNTI!";

  }

}

document.getElementById("start")

  .addEventListener("click", startGame);

document.getElementById("sound")

  .addEventListener("click", () => {

    soundOn = !soundOn;

    document.getElementById("sound").textContent =

      soundOn ? "🔊 AUDIO ON" : "🔇 AUDIO OFF";

  });

</script>

</body>

</html>
