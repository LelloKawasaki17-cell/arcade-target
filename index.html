

<!DOCTYPE html>

<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arcade Target</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  min-height: 100vh;

  background: #101025;

  color: white;

  font-family: Arial, sans-serif;

  text-align: center;

  padding: 25px 15px;

}

h1 {

  color: #00e5ff;

  font-size: 34px;

  text-shadow: 0 0 15px #00e5ff;

}

.subtitle {

  color: #aaa;

}

.stats {

  display: flex;

  justify-content: center;

  gap: 15px;

  margin: 25px 0;

}

.stat {

  background: #242442;

  border: 1px solid #454575;

  border-radius: 12px;

  padding: 15px;

  min-width: 95px;

}

.stat strong {

  display: block;

  font-size: 25px;

  color: #ffdf4d;

  margin-top: 5px;

}

#arena {

  position: relative;

  width: 100%;

  max-width: 500px;

  height: 350px;

  margin: auto;

  background: #191933;

  border: 2px solid #00e5ff;

  border-radius: 18px;

  overflow: hidden;

  box-shadow: 0 0 20px #00e5ff33;

}

#target {

  display: none;

  position: absolute;

  width: 65px;

  height: 65px;

  border-radius: 50%;

  border: 5px solid white;

  background: #ff3158;

  box-shadow: 0 0 20px #ff3158;

  cursor: pointer;

  touch-action: manipulation;

}

#target:active {

  transform: scale(0.85);

}

button.start {

  margin-top: 25px;

  padding: 16px 35px;

  border: none;

  border-radius: 30px;

  background: #00e5ff;

  color: #101025;

  font-size: 18px;

  font-weight: bold;

  cursor: pointer;

}

#message {

  margin-top: 20px;

  color: #ffdf4d;

  font-size: 18px;

  min-height: 25px;

}

</style>

</head>

<body>

<h1>🎯 ARCADE TARGET</h1>

<p class="subtitle">Quanto sei veloce? Dimostralo!</p>

<div class="stats">

  <div class="stat">

    PUNTI

    <strong id="score">0</strong>

  </div>

  <div class="stat">

    TEMPO

    <strong id="time">30</strong>

  </div>

  <div class="stat">

    RECORD

    <strong id="best">0</strong>

  </div>

</div>

<div id="arena">

  <button id="target" aria-label="Colpisci il bersaglio"></button>

</div>

<button class="start" id="start">INIZIA A GIOCARE</button>

<div id="message">Premi INIZIA per giocare!</div>

<script>

let score = 0;

let time = 30;

let timer;

let movement;

let playing = false;

let best = Number(localStorage.getItem("arcadeBest")) || 0;

const scoreDisplay = document.getElementById("score");

const timeDisplay = document.getElementById("time");

const bestDisplay = document.getElementById("best");

const target = document.getElementById("target");

const arena = document.getElementById("arena");

const message = document.getElementById("message");

const startButton = document.getElementById("start");

bestDisplay.textContent = best;

function moveTarget() {

  const maxX = arena.clientWidth - target.offsetWidth;

  const maxY = arena.clientHeight - target.offsetHeight;

  const x = Math.random() * maxX;

  const y = Math.random() * maxY;

  target.style.left = x + "px";

  target.style.top = y + "px";

}

function startGame() {

  clearInterval(timer);

  clearInterval(movement);

  score = 0;

  time = 30;

  playing = true;

  scoreDisplay.textContent = score;

  timeDisplay.textContent = time;

  message.textContent = "PRENDI IL BERSAGLIO!";

  startButton.textContent = "RIPARTI";

  target.style.display = "block";

  moveTarget();

  movement = setInterval(moveTarget, 1000);

  timer = setInterval(() => {

    time--;

    timeDisplay.textContent = time;

    if (time <= 0) {

      endGame();

    }

  }, 1000);

}

function endGame() {

  playing = false;

  clearInterval(timer);

  clearInterval(movement);

  target.style.display = "none";

  startButton.textContent = "GIOCA ANCORA";

  if (score > best) {

    best = score;

    localStorage.setItem("arcadeBest", best);

    bestDisplay.textContent = best;

    message.textContent = "🏆 NUOVO RECORD! Punti: " + score;

  } else {

    message.textContent = "PARTITA FINITA! Punti: " + score;

  }

}

target.addEventListener("click", () => {

  if (!playing) return;

  score++;

  scoreDisplay.textContent = score;

  moveTarget();

});

startButton.addEventListener("click", startGame);

</script>

</body>

</html>
