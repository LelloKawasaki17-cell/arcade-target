
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCADE TARGET 5.1</title>

<style>
* { box-sizing:border-box; margin:0; padding:0; }

body {
  background:#080611;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:16px;
}

.panel { max-width:650px; margin:auto; }

h1 {
  color:#c084fc;
  font-size:30px;
  margin:12px 0 5px;
  text-shadow:0 0 15px #a855f7;
}

.subtitle { color:#aaa; margin-bottom:18px; }

input {
  width:100%;
  padding:13px;
  margin-bottom:12px;
  background:#171126;
  color:white;
  border:1px solid #9333ea;
  border-radius:10px;
  font-size:16px;
}

.stats {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:12px;
}

.stat {
  background:#171126;
  border:1px solid #59358b;
  border-radius:12px;
  padding:11px 3px;
}

.stat span {
  display:block;
  color:#c084fc;
  font-size:11px;
  margin-bottom:5px;
}

.stat strong { font-size:19px; }

.extra {
  display:flex;
  justify-content:space-around;
  background:#171126;
  padding:12px;
  border-radius:12px;
  margin:10px 0;
  font-size:13px;
}

.extra strong { color:#facc15; }

#energyBar,#bossBar {
  height:10px;
  background:#292039;
  border-radius:10px;
  overflow:hidden;
  margin:10px 0;
}

#energyFill {
  height:100%;
  width:0;
  background:linear-gradient(90deg,#a855f7,#facc15);
}

#bossFill {
  height:100%;
  width:100%;
  background:#ef4444;
  transition:width .2s;
}

#arena {
  position:relative;
  height:410px;
  background:radial-gradient(circle,#261344,#0c0916);
  border:2px solid #9333ea;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 0 25px #7e22ce55;
  touch-action:manipulation;
}

#message {
  position:absolute;
  z-index:20;
  top:45%;
  width:100%;
  padding:10px;
  color:#e9d5ff;
  font-weight:bold;
  font-size:19px;
  pointer-events:none;
}

#target {
  position:absolute;
  width:65px;
  height:65px;
  border-radius:50%;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:26px;
  font-weight:bold;
  border:3px solid white;
  cursor:pointer;
  touch-action:manipulation;
  box-shadow:0 0 18px currentColor;
  z-index:4;
}

.red { background:#ef4444; color:white; }
.gold { background:#eab308; color:white; }
.diamond { background:#06b6d4; color:white; }
.bomb { background:#292929; color:#ff4444; }

#bossArea {
  display:none;
  position:absolute;
  top:12px;
  width:100%;
  z-index:3;
  pointer-events:none;
}

#bossCharacter {
  font-size:85px;
  display:inline-block;
  animation:oniFloat 1.2s infinite ease-in-out;
  filter:drop-shadow(0 0 15px #ff2222);
}

@keyframes oniFloat {
  0%,100% { transform:translateY(0) rotate(-3deg); }
  50% { transform:translateY(-9px) rotate(3deg); }
}

#bossName {
  font-size:15px;
  color:#facc15;
  font-weight:bold;
  text-shadow:0 0 10px red;
}

#bossBar {
  width:65%;
  margin:7px auto;
  border:1px solid white;
}

#bossFill { background:linear-gradient(90deg,#ef4444,#f97316); }

.projectile {
  position:absolute;
  left:50%;
  top:125px;
  width:58px;
  height:58px;
  margin-left:-29px;
  border-radius:50%;
  border:3px solid white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
  z-index:10;
  cursor:pointer;
  touch-action:manipulation;
  animation:fly 1.8s linear forwards;
}

.good {
  background:#06b6d4;
  color:white;
  box-shadow:0 0 18px #06b6d4;
}

.bad {
  background:#dc2626;
  color:white;
  box-shadow:0 0 18px red;
}

@keyframes fly {
  0% {
    transform:translate(0,0) scale(.75);
    opacity:1;
  }
  100% {
    transform:translate(var(--dx),var(--dy)) scale(1);
    opacity:.9;
  }
}

#bossInfo {
  display:none;
  color:#facc15;
  margin:8px;
  font-weight:bold;
}

.buttons {
  display:flex;
  gap:9px;
  margin-top:14px;
  flex-wrap:wrap;
}

button.action {
  flex:1;
  min-width:100px;
  padding:14px 7px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#9333ea,#6b21a8);
  color:white;
  font-size:14px;
  font-weight:bold;
}

#energyBtn {
  background:linear-gradient(135deg,#ca8a04,#854d0e);
}

button:disabled { opacity:.4; }

.leaderboard {
  margin-top:22px;
  background:#171126;
  border:1px solid #59358b;
  padding:15px;
  border-radius:14px;
  text-align:left;
}

.leaderboard h2 {
  text-align:center;
  color:#facc15;
  margin-bottom:12px;
}

.leaderboard p {
  padding:8px;
  border-bottom:1px solid #38254f;
}

@media(max-width:400px) {
  .stat strong { font-size:16px; }
  #arena { height:380px; }
}
</style>
</head>

<body>
<div class="panel">

<h1>🎯 ARCADE TARGET</h1>
<p class="subtitle">VERSION 5.1 · ONI BOSS EDITION</p>

<input id="playerName" maxlength="14"
placeholder="Inserisci il tuo nome">

<div class="stats">
  <div class="stat"><span>PUNTEGGIO</span><strong id="score">0</strong></div>
  <div class="stat"><span>TEMPO</span><strong id="time">45</strong></div>
  <div class="stat"><span>LIVELLO</span><strong id="level">1</strong></div>
  <div class="stat"><span>RECORD</span><strong id="best">0</strong></div>
</div>

<div class="extra">
  <div>❤️ Vite: <strong id="lives">3</strong></div>
  <div>🔥 Combo: <strong id="combo">0</strong></div>
  <div>⚡ Energia: <strong id="energy">0%</strong></div>
</div>

<div id="energyBar"><div id="energyFill"></div></div>

<div id="bossInfo">
  <div id="bossName">BOSS ONI</div>
  <div id="bossBar"><div id="bossFill"></div></div>
</div>

<div id="arena">

  <div id="bossArea">
    <div id="bossCharacter">👹</div>
  </div>

  <div id="message">Premi INIZIA per giocare!</div>
  <div id="target"></div>

</div>

<div class="buttons">
  <button class="action" id="startBtn">▶ INIZIA</button>
  <button class="action" id="energyBtn" disabled>⚡ RALLENTA</button>
  <button class="action" id="soundBtn">🔊 AUDIO ON</button>
</div>

<div class="leaderboard">
  <h2>🏆 TOP 5 CLASSIFICA</h2>
  <div id="leaderboard"></div>
</div>

</div>

<script>
let score=0,time=45,level=1,lives=3,combo=0,energy=0;
let playing=false,bossActive=false,slowed=false;
let bossHP=0,bossMaxHP=0,lastBossLevel=0;
let timer,movement,slowTimer,attackTimer,audio;
let soundOn=true;

const arena=document.getElementById("arena");
const target=document.getElementById("target");
const message=document.getElementById("message");

let best=Number(localStorage.getItem("arcadeBest"))||0;
document.getElementById("best").textContent=best;

const bosses=[
  {name:"ONI ROSSO",face:"👹",color:"#ef4444",hp:8},
  {name:"ONI BLU",face:"👺",color:"#06b6d4",hp:11},
  {name:"ONI VIOLA",face:"👹",color:"#a855f7",hp:14},
  {name:"ONI D'ORO",face:"👺",color:"#eab308",hp:17},
  {name:"ONI SUPREMO",face:"👹",color:"#dc2626",hp:22}
];

let bossIndex=0;

function playSound(freq=500) {
  if(!soundOn)return;
  try {
    audio=audio||new(window.AudioContext||window.webkitAudioContext)();
    if(audio.state==="suspended")audio.resume();
    const osc=audio.createOscillator();
    const gain=audio.createGain();
    osc.frequency.value=freq;
    gain.gain.setValueAtTime(.08,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.15);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime+.15);
  }catch(e){}
}

function updateUI(){
  scoreDisplay.textContent=score;
  document.getElementById("time").textContent=time;
  document.getElementById("level").textContent=level;
  document.getElementById("lives").textContent=lives;
  document.getElementById("combo").textContent=combo;
  document.getElementById("energy").textContent=energy+"%";
  document.getElementById("energyFill").style.width=energy+"%";
  document.getElementById("energyBtn").disabled=
    !playing||energy<100||slowed;
}

const scoreDisplay=document.getElementById("score");

function speed(){
  return Math.max(620,1050-(level-1)*35);
}

function stopMovement(){
  clearInterval(movement);
}

function moveTarget(){
  const size=target.offsetWidth;
  target.style.left=Math.floor(Math.random()*(arena.clientWidth-size))+"px";
  target.style.top=Math.floor(Math.random()*(arena.clientHeight-size))+"px";
}

function startMovement(){
  stopMovement();
  movement=setInterval(()=>{
    if(playing&&!bossActive&&!slowed)moveTarget();
  },speed());
}

function clearProjectiles(){
  document.querySelectorAll(".projectile").forEach(p=>p.remove());
}

function spawnNormalTarget(){
  if(!playing||bossActive)return;

  const r=Math.random();

  if(r<.48){
    target.className="red";
    target.textContent="+1";
  }else if(r<.70){
    target.className="gold";
    target.textContent="+5";
  }else if(r<.85){
    target.className="diamond";
    target.textContent="💎";
  }else{
    target.className="bomb";
    target.textContent="💣";
  }

  target.style.display="flex";
  moveTarget();
}

function updateBossBar(){
  document.getElementById("bossFill").style.width=
    Math.max(0,bossHP/bossMaxHP*100)+"%";
}

function startBoss(){
  bossActive=true;
  lastBossLevel=level;
  clearProjectiles();
  target.style.display="none";
  stopMovement();

  bossIndex=Math.floor(level/5)-1;
  const boss=bosses[Math.min(bossIndex,bosses.length-1)];

  bossMaxHP=boss.hp+Math.max(0,Math.floor(level/25))*5;
  bossHP=bossMaxHP;

  const character=document.getElementById("bossCharacter");
  character.textContent=boss.face;
  character.style.filter="drop-shadow(0 0 18px "+boss.color+")";

  document.getElementById("bossName").textContent=boss.name;
  document.getElementById("bossInfo").style.display="block";
  document.getElementById("bossArea").style.display="block";

  updateBossBar();
  message.textContent="⚠️ "+boss.name+" È ARRIVATO!";

  playSound(180);

  setTimeout(()=>{
    if(!playing)return;
    message.textContent="";
    attackTimer=setInterval(launchProjectile,slowed?1800:1250);
  },1300);
}

function launchProjectile(){
  if(!playing||!bossActive)return;

  const good=Math.random()<.68;
  const p=document.createElement("div");

  p.className="projectile "+(good?"good":"bad");
  p.textContent=good?"🎯":"💀";

  const maxX=arena.clientWidth-90;
  const dx=Math.floor(Math.random()*maxX)-maxX/2;
  const dy=170+Math.floor(Math.random()*125);

  p.style.setProperty("--dx",dx+"px");
  p.style.setProperty("--dy",dy+"px");

  p.addEventListener("pointerdown",function(e){
    e.preventDefault();
    if(!playing||!bossActive)return;

    if(good){
      bossHP--;
      score+=2;
      energy=Math.min(100,energy+5);
      combo++;
      playSound(750);
      message.textContent="💥 COLPITO! -1 VITA AL BOSS";
      updateBossBar();
      updateUI();

      if(bossHP<=0){
        defeatBoss();
      }
    }else{
      lives--;
      combo=0;
      playSound(130);
      message.textContent="💀 MALEDIZIONE! -1 TUA VITA";
      updateUI();

      if(lives<=0){
        p.remove();
        endGame();
        return;
      }
    }

    p.remove();

    setTimeout(()=>{
      if(playing&&bossActive)message.textContent="";
    },650);
  });

  p.addEventListener("animationend",()=>p.remove());
  arena.appendChild(p);
}

function defeatBoss(){
  bossActive=false;
  clearInterval(attackTimer);
  clearProjectiles();

  document.getElementById("bossArea").style.display="none";
  document.getElementById("bossInfo").style.display="none";

  score+=50+level*5;
  lives=Math.min(5,lives+1);
  energy=Math.min(100,energy+25);

  message.textContent="🏆 ONI SCONFITTO! +BONUS E +1 VITA!";
  playSound(1000);
  updateUI();

  setTimeout(()=>{
    if(!playing)return;
    message.textContent="";
    spawnNormalTarget();
    startMovement();
  },1800);
}

function updateLevel(){
  const newLevel=Math.floor(score/15)+1;

  if(newLevel>level){
    level=newLevel;
    playSound(850);

    if(level%5===0&&level!==lastBossLevel){
      startBoss();
    }else{
      message.textContent="⬆ LIVELLO "+level+"!";
    }

    startMovement();
  }
}

function hitNormalTarget(){
  if(!playing||bossActive)return;

  if(target.classList.contains("bomb")){
    score=Math.max(0,score-5);
    lives--;
    combo=0;
    playSound(150);
    message.textContent="💣 BOMBA! -1 VITA";

    if(lives<=0){
      updateUI();
      endGame();
      return;
    }
  }else{
    let points=target.classList.contains("diamond")?10:
      target.classList.contains("gold")?5:1;

    combo++;
    const multiplier=combo>=10?3:combo>=5?2:1;

    score+=points*multiplier;
    energy=Math.min(100,energy+8);
    playSound(600);
    message.textContent=multiplier>1?"🔥 COMBO x"+multiplier:"";
  }

  updateLevel();
  updateUI();

  if(!bossActive)spawnNormalTarget();

  setTimeout(()=>{
    if(playing&&!bossActive)message.textContent="";
  },500);
}

target.addEventListener("pointerdown",e=>{
  e.preventDefault();
  hitNormalTarget();
});

function activateEnergy(){
  if(!playing||energy<100||slowed)return;

  energy=0;
  slowed=true;
  clearInterval(movement);
  clearInterval(attackTimer);

  updateUI();
  message.textContent="⚡ RALLENTAMENTO ATTIVO!";

  if(bossActive){
    attackTimer=setInterval(launchProjectile,2200);
  }

  slowTimer=setTimeout(()=>{
    slowed=false;
    if(playing){
      if(bossActive){
        clearInterval(attackTimer);
        attackTimer=setInterval(launchProjectile,1250);
      }else{
        startMovement();
      }
      message.textContent="";
    }
    updateUI();
  },5000);
}

function saveScore(){
  const name=document.getElementById("playerName").value.trim()||"Giocatore";

  let scores=JSON.parse(localStorage.getItem("arcadeScores")||"[]");
  scores.push({name,score});
  scores.sort((a,b)=>b.score-a.score);
  scores=scores.slice(0,5);

  localStorage.setItem("arcadeScores",JSON.stringify(scores));
  showLeaderboard();
}

function showLeaderboard(){
  const scores=JSON.parse(localStorage.getItem("arcadeScores")||"[]");
  const board=document.getElementById("leaderboard");
  board.innerHTML="";

  if(!scores.length){
    board.textContent="Ancora nessun record!";
    return;
  }

  const medals=["🥇","🥈","🥉","4.","5."];

  scores.forEach((item,i)=>{
    const row=document.createElement("p");
    row.textContent=medals[i]+" "+item.name+" — "+item.score+" punti";
    board.appendChild(row);
  });
}

function startGame(){
  clearInterval(timer);
  clearInterval(attackTimer);
  clearInterval(movement);
  clearTimeout(slowTimer);
  clearProjectiles();

  score=0;
  time=45;
  level=1;
  lives=3;
  combo=0;
  energy=0;
  lastBossLevel=0;
  bossActive=false;
  slowed=false;
  playing=true;

  target.style.display="none";
  document.getElementById("bossArea").style.display="none";
  document.getElementById("bossInfo").style.display="none";
  document.getElementById("startBtn").textContent="↻ RICOMINCIA";

  message.textContent="";
  updateUI();
  spawnNormalTarget();
  startMovement();

  timer=setInterval(()=>{
    time--;
    updateUI();

    if(time<=0)endGame();
  },1000);
}

function endGame(){
  if(!playing)return;

  playing=false;
  clearInterval(timer);
  clearInterval(attackTimer);
  clearInterval(movement);
  clearTimeout(slowTimer);
  clearProjectiles();

  target.style.display="none";
  document.getElementById("bossArea").style.display="none";
  document.getElementById("bossInfo").style.display="none";

  if(score>best){
    best=score;
    localStorage.setItem("arcadeBest",best);
    document.getElementById("best").textContent=best;
  }

  saveScore();

  message.textContent="🏁 GAME OVER! PUNTEGGIO: "+score;
  document.getElementById("startBtn").textContent="▶ GIOCA ANCORA";
  updateUI();
}

document.getElementById("startBtn").addEventListener("click",startGame);
document.getElementById("energyBtn").addEventListener("click",activateEnergy);

document.getElementById("soundBtn").addEventListener("click",function(){
  soundOn=!soundOn;
  this.textContent=soundOn?"🔊 AUDIO ON":"🔇 AUDIO OFF";
  if(soundOn)playSound();
});

showLeaderboard();
updateUI();
</script>
</body>
</html>
